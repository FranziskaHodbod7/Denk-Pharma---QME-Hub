#!/bin/bash -e

# System-Specific variables:
#--------------------------------

# Devlab Server instance to be used vor CI/CD
DEVLAB=3

# dev-control branch (should be compatible with devlab - version 3.x is compatible with devlab 3)
DC_VERSION=3.0

# System the project runs on (Supported are: neos, shopware, shopware6, typo3)
SYSTEM="neos"

# System version (this is used to handly compatibility with devlab-control)
SYSTEM_VERSION=8.3

# Flag: Should media files be pulled from devlab? (define paths in MEDIA_DIRS)
DEVLAB_CI_USE_MEDIA=true

# Media directory on devlab server (should not be changed once a project is set up)
MEDIA_HOST_PROJECTDIR="format-d-kunden-denk-pharma-denk-pharma-qme-hub"

# Flag: Should database be pulled from devlab or should the local file dev/project_development.tar.gz be used?
DEVLAB_CI_USE_DB=true

# Database Version used (used to have a compatible version on devlab. Options: postgres-14.9, mariadb-10.5)
DEVLAB_DBINSTANCE="mariadb-11.4"

# MYSQL database name on devlab (will be set automatically when CI is setup by devlab ini-ci)
DEVLAB_DBNAME="denk_pharma_qme_hub_mysql_main"

# Flag: Should distribution files be uploaded to gitlab during build? Activate if deployment to live or stage is enabled.
DEVLAB_CI_USE_DIST=true

# Is index building needed for this project? (Possible options: none, sync, async)
DEVLAB_CI_USE_INDEX=none

# Absolute path in docker container where package.json resides
# (default set according to SYSTEM)
#NODE_WORKDIR=""

# Path relative to project root (used for caching node_modules during build)
# (default set according to SYSTEM)
#NODE_MODULES_SUBDIR=""

# Whitespace separated list of folders that should be pushed and pulled (fd media) from online storage (used for sharing big amounts of media files)
# (default set according to SYSTEM)
#MEDIA_DIRS=""

# Absolute path in docker container where composer.json resides (Set empty if no composer is used)
# (default set according to SYSTEM)
#COMPOSER_WORKDIR=""

# Absolute path in docker container where CLI executable resides (Set empty if no CLI is used)
# (default set according to SYSTEM)
#CLI_WORKDIR=""

# Filename of the CLI executable (Set empty if no CLI is used)
# (default set according to SYSTEM)
#CLI_COMMAND=""

# Array of tablenames to ignore during mysqldump in db copy commands (e.g. ./fd db devlab-to-local)
# (default set according to SYSTEM)
#MYSQL_IGNORETABLES=(table1 table2 table3)

# Array of tablenames to ignore and create only the structure in db copy commands (e.g. ./fd db devlab-to-local)
# (default set according to SYSTEM)
#MYSQL_IGNORETABLESCONTENT=(table1 table2 table3)


# Live System-Specific variables:
#--------------------------------

# Live SSH Connection and deploy path (no passwords as they need to be provided on demand)
LIVE_HOST=""
LIVE_SSH_USER=""
LIVE_SSH_PORT="22"
LIVE_DEPLOYPATH=""

# Database connection
# (Connection is established after connecting to server via ssh so provide local connection details)
LIVE_DBSERVER=""
LIVE_DBNAME=""
LIVE_DBPORT="3306"
LIVE_DBUSER=""
LIVE_DBDUMPPARAMS="--no-tablespaces"


