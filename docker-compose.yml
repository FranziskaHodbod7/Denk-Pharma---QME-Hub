services:
  #######################################
  # PHP application Docker container
  #######################################
  app:
    build:
      context: dev/dockerprovisioning/app/
      dockerfile: Apache-PHP-85-Node24.Dockerfile.dev
    links:
      - mysql
#      - postgres
#      - opensearch
    networks:
      - app-network


  #######################################
  # MySQL server
  #######################################
  mysql:
    build:
      context: dev/dockerprovisioning/mysql/
      dockerfile: MariaDB-11-4.Dockerfile.dev
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

