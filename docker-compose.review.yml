services:
  #######################################
  # PHP application Docker container
  #######################################
  app:
    image: ${CI_REGISTRY_IMAGE}/app:${CI_COMMIT_REF_SLUG}
    build:
      # change context to have complete source-code available for copying to image
      context: .
      dockerfile: dev/dockerprovisioning/app/Apache-PHP-85.Dockerfile.review
    env_file:
      - dev/dev-control/devlab/smtp-credentials.env
      - dev/dockerprovisioning/default.env
      - dev/dockerprovisioning/review.env
    networks:
      - web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}.rule=Host(`${DEVLAB_PROJECT_HOST}`)"
      - "traefik.http.routers.${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}.middlewares=${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}-auth"
      - "traefik.http.middlewares.${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}-pass-auth.basicauth.users=---FD_DEVLAB_PASSWD_REPLACE---"
      - "traefik.http.middlewares.${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}-pass-auth.basicauth.usersfile=/secrets/traefik-reviewUsers"
      - "traefik.http.middlewares.${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}-pass-auth.basicauth.realm=Devlab"
      - "traefik.http.middlewares.${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}-auth.chain.middlewares=fd-review-ip-auth@file,${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}-pass-auth"
      - "traefik.http.services.app-${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}.loadbalancer.server.scheme=https"
      - "traefik.http.services.app-${CI_PROJECT_PATH_SLUG}_${CI_COMMIT_REF_SLUG}.loadbalancer.server.port=443"

  #######################################
  # MySQL server
  #######################################
  mysql:
    image: ${CI_REGISTRY_IMAGE}/mysql:${CI_COMMIT_REF_SLUG}
    build:
      dockerfile: MariaDB-11-4.Dockerfile.review
    env_file:
      - dev/dockerprovisioning/default.env
      - dev/dockerprovisioning/review.env
    restart: unless-stopped
    labels:
      - traefik.enable=false

